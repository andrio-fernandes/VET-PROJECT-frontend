<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f5f5f5"/>
  <rect x="0" y="0" width="400" height="300" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Mountain landscape silhouette -->
  <polygon points="0,300 80,180 140,220 200,140 260,200 320,160 400,210 400,300" fill="#e8e8e8"/>
  <polygon points="0,300 60,210 120,240 180,170 240,220 300,190 400,230 400,300" fill="#e0e0e0"/>
  <!-- Sun -->
  <circle cx="310" cy="80" r="30" fill="#d0d0d0"/>
  <!-- Clouds -->
  <ellipse cx="120" cy="70" rx="40" ry="15" fill="#ebebeb"/>
  <ellipse cx="100" cy="65" rx="25" ry="12" fill="#ebebeb"/>
  <ellipse cx="140" cy="68" rx="20" ry="10" fill="#ebebeb"/>
  <!-- Small birds -->
  <path d="M50,90 Q55,85 60,90" fill="none" stroke="#ccc" stroke-width="1.5"/>
  <path d="M70,80 Q75,75 80,80" fill="none" stroke="#ccc" stroke-width="1.5"/>
</svg>
